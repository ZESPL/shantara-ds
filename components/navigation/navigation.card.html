<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../i18n.js"></script>
<style>body{padding:20px;background:var(--surface-page)}.stack{display:flex;flex-direction:column;gap:var(--space-6)}.pair{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-6)}</style></head><body><div id="root"></div>
<script type="text/babel">
const { AnnouncementBar, Tabs, Breadcrumbs, Accordion } = window.ShantaraDesignSystem_45bbe4;
function Demo(){
  const {t,ar}=window.ShantaraI18n.useLocale();
  return (<div className="stack">
<div style={{margin:"-20px -20px 0"}}><AnnouncementBar href="#" linkLabel={t("Book a Consultation")}>{t("A stay is confirmed after a doctor has spoken with you.")}</AnnouncementBar></div>
<Breadcrumbs items={[{label:t("Programmes"),href:"#"},{label:t("Wellness"),href:"#"},t("Detox")]}/>
<Tabs items={[t("Overview"),t("Therapies"),t("Rooms"),t("Journal")]}/>
<Tabs variant="pill" items={[{value:"all",label:t("All"),count:13},{value:"therapies",label:t("Therapies")},{value:"diet",label:t("Diet")}]}/>
<Accordion items={[{title:t("How long should I stay?"),content:t("Duration depends on the programme and your assessment. Your doctor advises a typical duration after consultation.")},{title:t("How do meals work?"),content:t("Meals are part of the treatment, personalised to your condition — not a menu.")}]}/>
<p className="shantara-note">Underline tabs grow a 1.5px Himalaya rule from the inline start (240ms). Pill tabs cross-fade the selected fill. Accordion panels open 0fr→1fr over 240ms; the plus becomes a minus. Breadcrumb ancestors underline on hover. Arrow keys follow reading direction.</p>
<div className="pair">
<div className="stack" dir="ltr" lang="en">
<p className="shantara-usage-label">LTR</p>
<Breadcrumbs items={[{label:"Programmes",href:"#"},{label:"Wellness",href:"#"},"Detox"]}/>
<Tabs items={["Overview","Therapies","Rooms"]}/>
<Tabs variant="pill" items={[{value:"all",label:"All",count:13},{value:"diet",label:"Diet"}]}/>
<Accordion defaultOpen={null} items={[{title:"How long should I stay?",content:"Duration depends on the programme and your assessment. Your doctor advises a typical duration after consultation."}]}/>
</div>
<div className="stack shantara-rtl" dir="rtl" lang="ar">
<p className="shantara-usage-label">RTL</p>
<Breadcrumbs items={[{label:ar("Programmes"),href:"#"},{label:ar("Wellness"),href:"#"},ar("Detox")]}/>
<Tabs items={[ar("Overview"),ar("Therapies"),ar("Rooms")]}/>
<Tabs variant="pill" items={[{value:"all-rtl",label:ar("All"),count:13},{value:"diet-rtl",label:ar("Diet")}]}/>
<Accordion defaultOpen={null} items={[{title:ar("How long should I stay?"),content:ar("Duration depends on the programme and your assessment. Your doctor advises a typical duration after consultation.")}]}/>
</div>
</div>
<p className="shantara-note">In RTL the trail, tabs and plus sit at the inline start. ArrowLeft selects the next tab; the underline grows from the right.</p>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
