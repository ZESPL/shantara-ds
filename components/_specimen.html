<body>
  <!-- Portal harness: ?ground=pine|himalaya|stone|merino paints the page with that ground
       (dark grounds re-point the ink tokens), and portal.js adds the hover Copy-ID chip
       for every element carrying data-ds-id. -->
  <script>
    (function () {
      var ground = new URLSearchParams(location.search).get("ground");
      if (ground && /^(pine|himalaya|stone|merino)$/.test(ground)) {
        document.documentElement.setAttribute("data-ground", ground);
        document.body.setAttribute("data-ground", ground);
      }
    })();
  </script>
  <script src="../portal.js" data-mode="specimen"></script>
  <div id="root"></div>
  <script type="text/babel">
    const NS = window.ShantaraDesignSystem_45bbe4;

    /* A variation of an existing section, shown under its main specimen (doc § Variations). */
    function Variation() {
      const NSV = window.ShantaraDesignSystem_45bbe4 || {};
      const { Button, Breadcrumbs, Input, Textarea, Statement, Tile, TextLink, Section, HeroSplit, HeroStatement, SplitSection, BandStatement, PanoramaCaption, PeopleRow, TileGrid, IndexList, ClosingCTA, FormSplit, ArticleHeader } = NSV;
      const P = PH;
      const Label = ({ children }) => <p style={{ margin: 0, padding: "10px var(--layout-gutter)", font: "var(--type-caption)", letterSpacing: "var(--tracking-wide)", color: "var(--text-muted)", background: "var(--surface-page)", borderBlock: "1px dashed var(--border-subtle)" }}>{children}</p>;
      switch (name) {
        case "HeroStatement": return <><Label><b>variant="utility"</b> · legal pages, 404, confirmation — short, no band, no image</Label>

        case "HeroSplit": return <><Label><b>video</b> · a short muted loop in place of the photograph (poster only here: no R2 host in the design system)</Label>

        case "SplitSection": return <><Label><b>stack</b> + <b>id</b> · text above the photograph at every width; the anchor clears the sticky header</Label>
          <SplitSection id="hijama" stack ground="stone" src={P + "treatment.jpg"} alt="A treatment room"><Statement sub="Traditional cupping, delivered under medical supervision.">Hijama</Statement></SplitSection>
          <Label><b>video</b> · the player in the photograph's place (poster only here)</Label>

        case "TileGrid": return <><Label><b>layout="4"</b> · small items: therapies, amenities</Label>
          <Section><TileGrid layout="4" title="Therapies">{therapyEntries.map((t) => <Tile key={t.id} src={t.src} alt={t.alt} ratio="4:3" title={t.title} text={t.text} href={"#" + t.id} />)}</TileGrid></Section>
          <Label><b>layout="list"</b> · one per row, photograph beside the text from 760px</Label>
          <Section ground="stone"><TileGrid layout="list" title="From the Journal">{[0, 1].map((i) => <Tile key={i} src={P + (i ? "grounds.jpg" : "treatment.jpg")} alt={i ? "The grounds" : "A treatment room"} ratio="3:2" title={i ? "Managing PCOS through lifestyle" : "How programme duration is decided"} meta={["Clinical Guides", (5 + i) + " min read"]} text={i ? "A programme may be planned around hormonal health, meals, activity and rest." : "Duration depends on the programme and your assessment."} href="#" />)}</TileGrid></Section></>;
        case "PeopleRow": return <><Label><b>size="sm"</b> · five to eight people</Label>

        case "IndexList": return <><Label><b>anchors</b> + <b>counts</b> · same-page links, no arrow, a count per group</Label>
          <Section ground="stone"><IndexList anchors counts groups={[{ label: "Water and earth", items: [{ title: "Hydrotherapy", id: "hydrotherapy", text: "Water at controlled temperatures to support circulation." }, { title: "Mud Therapy", id: "mud-therapy", text: "Mineral-rich earth applied to calm inflammation and ease physical tension." }] }, { label: "Touch", items: [{ title: "Massage Therapy", id: "massage-therapy", text: "Therapeutic touch to ease muscle tension and support rest." }, { title: "Hijama", id: "hijama", text: "Traditional cupping, delivered under medical supervision." }] }]} /></Section></>;
        case "ClosingCTA": return <><Label><b>variant="whatsapp"</b> · WhatsApp first, call second</Label>
          <ClosingCTA variant="whatsapp" title="Prefer to message us?" sub="Our team replies on WhatsApp and can arrange a call." whatsapp="https://wa.me/919553600100" phone="tel:+919553600100" phoneLabel="Call +91 9553 600 100" />

        case "ArticleHeader": return <><Label><b>video</b> · a video article, the player in the lead photograph's place</Label>

    function Specimen() {
      if (!NS || !NS[name]) {
        return <p className="err">Unknown component: {name}</p>;
      }
      const {
        Button, IconButton, Icon, Logo, Card, Badge, Tag, Divider, PatternPanel,
        Input, Textarea, Select, Checkbox, Radio, Switch,
        Tabs, Breadcrumbs, Accordion, LanguageSelector,
        Dialog, Toast, Tooltip, Spinner,
        Media, MetaRow, Statement, Numeral, TextLink, Tile, NumberedSteps, PlainList,
        GroupedList, SpecTable, TimeTable, QuoteBlock, PortraitFrame,
        Prose, ArticleFigure, AuthorCard, ReviewedBy, TableOfContents, ShareBar, Pagination,
        Section, HeroFullBleed, HeroSplit, HeroStatement, SplitSection, BandStatement, PanoramaCaption,
        PeopleRow, NumeralsSplit, TileGrid, IndexList, ClosingCTA, FormSplit, ArticleHeader, RelatedArticles,
        FaqSection, InPageNav, CatalogueSection, InclusionsSection, ContactLocation, ArticleLayout, ListingSection,
        KeyFacts, ProcessSection, TimelineSection, FeatureGrid, GalleryGrid, VideoFeature, ProgrammeCompare, NoticeBand,
        ReferencesSection, CredentialStrip, GuestStory, ConfirmationSection, NotFoundSection, PolicySection, Video,
      } = NS;
      const P = "../assets/photos/";
      const doctors = [
        { name: "Dr. Bahja Janu", role: "Medical Director", src: P + "doctor-bahja-janu-portrait-cropped.jpeg" },
        { name: "Dr. Gangrei Gangmei", role: "Resident Medical Officer", src: P + "doctor-gangrei-gangmei-portrait-cropped.jpeg" },
      ];
      const programmes = [
        { name: "Stress Management", focus: "Mind", durations: "7–14 nights", photo: "balcony", alt: "A balcony over the valley", text: "Doctor-led routines, therapies and rest for guests managing sustained stress, poor sleep or fatigue.", slug: "stress-management" },
        { name: "Detox", focus: "Metabolic", durations: "7–21 nights", photo: "water-wall", alt: "The water wall court", text: "Your doctor may recommend a meal plan or supervised fasting based on your assessment. Therapies may also form part of your programme.", slug: "detox" },
        { name: "Weight Management", focus: "Metabolic", durations: "14–21 nights", photo: "grounds", alt: "The grounds", text: "Meals, daily activity and therapies, with weight and vitals reviewed by a doctor each morning.", slug: "weight-management" },
      ];
      const tiles = programmes.map((p) => <Tile key={p.slug} src={P + p.photo + ".jpg"} alt={p.alt} title={p.name} meta={[p.focus, p.durations]} text={p.text} href={"#/en/programs/" + p.slug} />);
      const careSteps = [
        { title: "Consultation and assessment", text: "Our doctors consider your medical history, current health, lifestyle and goals." },
        { title: "A plan for you", text: "They then plan your treatments, meals, activity and rest." },
        { title: "Therapies and daily routines", text: "Your doctor may recommend therapies based on your assessment and programme." },
        { title: "Progress reviewed", text: "The plan is reviewed during your stay and adjusted where necessary." },
      ];
      const day = [
        { time: "Morning", title: "Vitals and doctor review", text: "Vitals and a short doctor review, then yoga therapy in the hall. Movement and breathwork are adapted to what you can manage that day." },
        { time: "Midday", title: "Therapies", text: "Therapy sessions may include mud therapy, hydrotherapy, massage or acupuncture, sequenced by the clinical team." },
        { time: "Afternoon", title: "Sunlight, walking or reading", text: "Depending on your programme, the afternoon may include controlled sunlight, walking on the grounds, or time in the library." },
        { time: "Evening", title: "Meal and rest", text: "A meal planned for your programme, a mind-body session and an early night." },
      ];
      const rooms = [
        { name: "Standard Room", size: "260 sq.ft", occ: "Single or double" },
        { name: "Junior Suite", size: "420 sq.ft", occ: "Single or double" },
        { name: "Superior Room", size: "300 sq.ft · balcony", occ: "Single or double" },
        { name: "Premium Room", size: "460 sq.ft · balcony", occ: "Single or double" },
        { name: "Executive Suite", size: "530 sq.ft · balcony", occ: "Single or double" },
      ];
      const roomCols = [{ key: "name", label: "Room" }, { key: "size", label: "Size", accent: true, mobileLabel: true }, { key: "occ", label: "Occupancy", mobileLabel: true }];
      const contact = [
        { icon: "phone", label: "+91 9553 600 100", href: "tel:+919553600100" },
        { icon: "mail", label: "heal@shantara.life", href: "mailto:heal@shantara.life" },
        { icon: "map-pin", label: "Chennamangallur, Kozhikode, Keralam, India - 673602" },
      ];
      const contactPlain = contact.map(({ icon, ...c }) => c);
      const tocItems = [
        { id: "how-meals-are-planned", label: "How meals are planned" },
        { id: "supervised-fasting", label: "Supervised fasting" },
        { id: "dietary-requirements", label: "Dietary requirements" },
        { id: "at-a-glance", label: "At a glance" },
      ];
      const articleBody = <>
        <p>Meals at Shantara are part of your programme. They are planned after your consultation and assessment, and reviewed with the rest of your plan during your stay.</p>
        <h2 id="how-meals-are-planned">How meals are planned</h2>
        <p>Your doctor considers your medical history, current health and goals, then recommends a meal plan. The kitchen prepares meals to that plan. <a href="#">Read about the care model</a>.</p>
        <ul>
          <li>Meals are planned for your programme, not chosen from a menu.</li>
          <li>Your doctor may adjust the plan as your stay goes on.</li>
          <li>Tell the team about allergies or dietary requirements before you arrive.</li>
        </ul>
        <h2 id="supervised-fasting">Supervised fasting</h2>
        <p>Your doctor may recommend supervised fasting based on your assessment. It is never a default and is reviewed each day.</p>

          <li>Vitals and a short doctor review in the morning.</li>

            <tr><td>Evening</td><td>A light meal and an early night</td></tr>
          </tbody>
        </table>
      </>;

          return <div className="row">

          return <Card padding="sm" style={{ maxWidth: 280 }}>

            <ArticleLayout toc={[{ id: "how-meals-are-planned", label: "How meals are planned" }, { id: "supervised-fasting", label: "Supervised fasting" }, { id: "what-to-tell-us", label: "What to tell us before you arrive" }]} aside={<ReviewedBy name="Dr. Bahja Janu" role="Medical Director" date="20 August 2026" dateTime="2026-08-20" />}>
              <Prose>
                <p>Meals are planned as part of your programme, taking into account your doctor's recommendations and any dietary requirements you share before you arrive.</p>
                <h2 id="how-meals-are-planned">How meals are planned</h2>
                <p>Your doctor reviews your assessment and sets the pattern of your meals. The kitchen prepares them from the plan, and the plan is reviewed as your stay progresses.</p>
                <h2 id="supervised-fasting">Supervised fasting</h2>
                <p>Some programmes include a period of supervised fasting. It is recommended only after assessment, and your doctor reviews how you are doing each day.</p>
                <h2 id="what-to-tell-us">What to tell us before you arrive</h2>
                <p>Share any allergies, intolerances and the medication you take, so the plan can account for them from the first day.</p>
              </Prose>
            </ArticleLayout>
          </Section>;
        case "ListingSection": {
          const [cat, setCat] = React.useState("all");
          const [pg, setPg] = React.useState(1);
          const all = [
            { title: "How programme duration is decided", src: P + "treatment.jpg", alt: "A treatment room", category: "Clinical Guides", cat: "clinical", readTime: "5 min read" },
            { title: "Managing PCOS through lifestyle", src: P + "grounds.jpg", alt: "The grounds", category: "Clinical Guides", cat: "clinical", readTime: "6 min read" },
            { title: "How meals are planned during a stay", src: P + "dining-restaurant-valley-window.jpg", alt: "The dining room", category: "Food & Recipes", cat: "food", readTime: "4 min read" },
            { title: "How rooms are designed", src: P + "room-twin.jpg", alt: "A twin room", category: "Life at Shantara", cat: "life", readTime: "3 min read" },
            { title: "A week of monsoon light", src: P + "valley.jpg", alt: "The valley", category: "Life at Shantara", cat: "life", readTime: "4 min read" },
            { title: "What happens at your naturopathy assessment", src: P + "consultation-doctor-at-desk-with-guest-landscape-3x2.jpg", alt: "A doctor at a consultation desk", category: "Clinical Guides", cat: "clinical", readTime: "5 min read" },
          ];
          const shown = all.filter((a) => cat === "all" || a.cat === cat);
          return <Section>
            <ListingSection title="Journal" sub="Clinical guides, food and life at Shantara, written and reviewed by our team."
              categories={[{ id: "clinical", label: "Clinical Guides" }, { id: "food", label: "Food & Recipes" }, { id: "life", label: "Life at Shantara" }, { id: "events", label: "Events" }]}
              category={cat} onCategory={(c) => { setCat(c); setPg(1); }} page={pg} pageCount={cat === "all" ? 3 : 1} onPage={setPg}>
              {shown.map((a) => <Tile key={a.title} src={a.src} alt={a.alt} ratio="3:2" title={a.title} meta={[a.category, a.readTime]} href="#" />)}
            </ListingSection>
          </Section>;
        }
        case "KeyFacts":
          return <Section>
            <KeyFacts title="Detox" facts={[
              { label: "Focus", value: "Metabolic" },
              { label: "Typical length", value: "7–21 nights" },
              { label: "Begins with", value: "Consultation and assessment" },
              { label: "Supervision", value: "Daily doctor consultation" },
              { label: "Meals", value: "Planned for your programme" },
            ]} action={<TextLink href="#">What the programme includes</TextLink>}>
              <p>Your doctor may recommend a meal plan or supervised fasting based on your assessment. Therapies may also form part of your programme.</p>
              <p>The plan is reviewed during your stay and adjusted where necessary.</p>
            </KeyFacts>
          </Section>;
        case "ProcessSection":
          return <Section ground="stone">
            <ProcessSection title="How a stay begins" sub="From your first message to your first morning." steps={[
              { title: "Send your details", text: "Share your name and a number we can reach." },
              { title: "A call from our team", text: "A member of the team calls to understand what you need." },
              { title: "A doctor reviews", text: "A doctor reviews whether a stay is the right next step." },
              { title: "Your stay is confirmed", text: "A stay is confirmed after a doctor has spoken with you." },
            ]} action={<Button>Book a Consultation</Button>} />
          </Section>;
        case "TimelineSection":
          return <Section>
            <TimelineSection title="A day at Shantara" sub="Every guest follows the same daily rhythm. Your doctor prescribes the treatments that fill the morning and afternoon." rows={daySchedule} src={P + "activity-hall-yoga-studio-empty.jpg"} alt="The yoga hall in the morning" />
          </Section>;
        case "FeatureGrid":
          return <Section>
            <FeatureGrid title="Around the retreat" sub="Spaces for movement, rest and quiet, across the hilltop." items={[
              { icon: "sun", title: "Yoga Hall", text: "Guided yoga practice, breathing sessions and meditation." },
              { icon: "droplets", title: "Swimming Pool", text: "Gentle movement and recovery through water-based activity." },
              { icon: "book-open", title: "Library", text: "A quiet space for reading and reflection." },
              { icon: "sprout", title: "Organic Farm", text: "Grows produce used in daily meals." },
              { icon: "mountain", title: "Sky Garden", text: "An elevated space for quiet walks at sunrise or in the evening." },
              { icon: "heart-pulse", title: "24-hour Nursing Care", text: "The on-site nursing team, included for every guest." },
            ]} />
          </Section>;
        case "GalleryGrid":
          return <Section>
            <GalleryGrid title="The rooms" items={[
              { src: P + "room-premium.jpg", alt: "A room with a balcony over the valley", caption: "Premium Room, with a balcony over the valley." },
              { src: P + "room-bedroom-forest-view-armchair.jpg", alt: "An armchair by the window, forest beyond", caption: "Rooms open to the surrounding hills." },
              { src: P + "suite-living-balcony-empty.jpg", alt: "A suite living room opening to a balcony", caption: "Executive Suite living room." },
              { src: P + "room-twin.jpg", alt: "A twin room", caption: "Single or double occupancy." },
              { src: P + "room-bedroom-desk-balcony-view.jpg", alt: "A desk by the balcony door" },
            ]} />
          </Section>;
        case "VideoFeature":
          return <>
            <Section>
              <VideoFeature title="A day at Shantara" sub="Morning yoga to evening meditation, in three minutes." video={{ poster: P + "valley.jpg", title: "A day at Shantara", captions: undefined }} note="Captions available. The video does not play automatically." />
            </Section>
            <VideoFeature layout="split" ground="stone" title="Inside the yoga hall" sub="How a morning session is guided, adapted to what you can manage that day." video={{ poster: P + "activity-hall-yoga-studio-empty.jpg", title: "Inside the yoga hall" }} />
          </>;
        case "ProgrammeCompare":
          return <Section>
            <ProgrammeCompare title="Programmes at a glance" programmes={programmeRows} action={<TextLink href="#">Current rates are on the tariff page</TextLink>} />
          </Section>;
        case "NoticeBand":
          return <Section>
            <div style={{ display: "flex", flexDirection: "column", gap: 40 }}>
              <NoticeBand title="Continue your medication">Do not stop or change any medication before you arrive. Your doctor reviews it with you at your consultation.</NoticeBand>
              <NoticeBand tone="caution" layout="band" title="A stay is confirmed after a doctor has spoken with you" action={<TextLink href="#">Book a Consultation</TextLink>}>Share your health assessment and records first.</NoticeBand>
            </div>
          </Section>;
        case "ReferencesSection":
          return <Section>
            <ReferencesSection items={[
              { work: "[Title of the cited work]", source: "[Journal or publisher]", year: "[Year]", href: "https://example.org/the-source" },
              { work: "[Title of the cited work]", source: "[Journal or publisher]", year: "[Year]", href: "https://example.org/another-source-with-a-long-address/that-wraps-on-phones" },
            ]} reviewer={{ name: "Dr. Bahja Janu", role: "Medical Director", date: "20 August 2026", dateTime: "2026-08-20" }} />
          </Section>;
        case "CredentialStrip":
          return <Section>
            <CredentialStrip title="Registrations and qualifications" items={[
              { name: "BNYS", issuer: "Rajiv Gandhi University of Health Sciences", holder: "Dr. Bahja Janu" },
              { name: "Medical licence", issuer: "Travancore-Cochin Medical Council (TCMC), Kerala", holder: "Dr. Bahja Janu" },
              { name: "Medical licence", issuer: "Ministry of Health, Saudi Arabia", holder: "Dr. Bahja Janu" },
            ]} />
          </Section>;
        case "GuestStory":
          return <>
            <Section>
              <GuestStory story={{ quote: "[Placeholder — a consented guest story, in the guest's own words.]", name: "[First name, with consent]", context: "[Programme · length of stay]", src: P + "balcony-lounge-infinity-edge-valley.jpg", alt: "The balcony lounge over the valley" }} />
            </Section>
            <Section ground="stone">
              <GuestStory title="Guests in their own words" stories={[
                { quote: "[Placeholder — a short consented quote.]", name: "[Initial]", context: "[Programme]" },
                { quote: "[Placeholder — a short consented quote.]", name: "[Initial]", context: "[Programme]" },
                { quote: "[Placeholder — a short consented quote.]", name: "[Initial]", context: "[Programme]" },
              ]} />
            </Section>
          </>;
        case "ConfirmationSection":
          return <Section>
            <ConfirmationSection autoFocus={false} sub="Thank you. We have your details."
              next={["A member of the team will call you to understand what you need.", "A doctor then reviews whether a stay is the right next step.", "A stay is confirmed after a doctor has spoken with you."]}
              contact={[contact[0], { icon: "message-circle", label: "WhatsApp", href: "https://wa.me/919553600100?text=" + encodeURIComponent("Hello, I have just sent my details on the Shantara website.") }, contact[1]]}
              explore={[
                { src: P + "dining-restaurant-valley-window.jpg", alt: "The dining room above the valley", title: "A day at Shantara", meta: ["Experience"], text: "From the first consultation to lights out.", href: "#a-day-at-shantara" },
                { src: P + "consultation-doctor-at-desk-with-guest-landscape-3x2.jpg", alt: "A doctor in consultation with a guest", title: "Meet the doctors", meta: ["About"], text: "Who you will speak with before a stay.", href: "#our-doctors" },
                { src: P + "balcony.jpg", alt: "A balcony over the valley", title: "Current rates and what a stay includes", meta: ["Tariff"], text: "Rooms, inclusions, payment and cancellation.", href: "#tariffs" },
              ]}
              actions={<Button variant="secondary">Back to home</Button>} />
          </Section>;
        case "NotFoundSection":
          return <Section>
            <NotFoundSection links={[{ label: "Programmes", href: "#programmes" }, { label: "Conditions", href: "#conditions" }, { label: "Book a Consultation", href: "#book" }, { label: "Contact", href: "#contact" }]} />
          </Section>;
        case "PolicySection":
          return <Section>
            <PolicySection title="Payment and cancellation" sub="The terms that apply to every confirmed stay." clauses={[
              { title: "Payment", text: "The share due at confirmation depends on how far ahead you book.", columns: [{ key: "when", label: "Booked" }, { key: "now", label: "At confirmation" }, { key: "rest", label: "Balance" }], rows: tariff.payment_terms.map((t) => ({ when: t.booked_before, now: t.at_confirmation, rest: t.balance })) },
              { title: "Cancellation", text: "Refunds depend on when a stay is cancelled.", columns: [{ key: "when", label: "Cancelled" }, { key: "refund", label: "Refund" }], rows: tariff.cancellation.map((t) => ({ when: t.cancelled_before, refund: t.refund })) },
              { title: "Companions", text: "A companion staying in a separate room is charged separately. Our team confirms the amount." },
            ]} />
          </Section>;
        case "Video":
          return <div style={{ padding: 24, display: "grid", gap: 24, maxWidth: 960 }}>
            <Video poster={P + "valley.jpg"} title="A day at Shantara" />
            <div style={{ maxWidth: 480 }}><Video mode="loop" ratio="4:5" poster={P + "water-wall.jpg"} title="The water wall" /></div>
          </div>;
        default:
          return <p className="err">No specimen for {name}</p>;
      }
    }

    const SECTIONS = ["Section", "HeroFullBleed", "HeroStatement", "SplitSection", "BandStatement", "PanoramaCaption", "PeopleRow", "NumeralsSplit", "TileGrid", "IndexList", "ClosingCTA", "FormSplit", "HeroSplit", "ArticleHeader", "RelatedArticles", "FaqSection", "InPageNav", "CatalogueSection", "InclusionsSection", "ContactLocation", "ArticleLayout", "ListingSection", "KeyFacts", "ProcessSection", "TimelineSection", "FeatureGrid", "GalleryGrid", "VideoFeature", "ProgrammeCompare", "NoticeBand", "ReferencesSection", "CredentialStrip", "GuestStory", "ConfirmationSection", "NotFoundSection", "PolicySection"];
    if (SECTIONS.includes(name)) document.body.style.padding = "0";
    ReactDOM.createRoot(document.getElementById("root")).render(<><Specimen /><Variation /></>);
  </script>
