<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Component specimen</title>
  <link rel="stylesheet" href="../styles.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../_ds_bundle.js"></script>
  <script src="../i18n.js"></script>
  <link rel="stylesheet" href="../chrome.css">
  <style>
    body{margin:0;padding:24px;background:var(--surface-page)}
    .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
    .stack{display:flex;flex-direction:column;gap:16px;max-width:420px}
    .err{color:var(--text-secondary);font-size:var(--text-sm)}
  </style>
</head>
<body>
  <!-- Portal harness: ?ground=pine|himalaya|stone|merino paints the page with that ground
       (dark grounds re-point the ink tokens), and portal.js adds the hover Copy-ID chip
       for every element carrying data-ds-id. -->
  <script>
    (function () {
      var ground = new URLSearchParams(location.search).get("ground");
      if (ground && /^(pine|himalaya|stone|merino)$/.test(ground)) {
        document.documentElement.setAttribute("data-ground", ground);
        document.body.setAttribute("data-ground", ground);
      }
    })();
  </script>
  <script src="../portal.js" data-mode="specimen"></script>
  <div id="root"></div>
  <script type="text/babel">
    const NS = window.ShantaraDesignSystem_45bbe4;
    const name = new URLSearchParams(location.search).get("c") || "Button";

    function Specimen() {
      if (!NS || !NS[name]) {
        return <p className="err">Unknown component: {name}</p>;
      }
      const {
        Button, IconButton, Icon, Logo, Card, Badge, Tag, Divider, PatternPanel,
        Input, Textarea, Select, Checkbox, Radio, Switch,
        Tabs, Breadcrumbs, Accordion, LanguageSelector,
        Dialog, Toast, Tooltip, Spinner,
        Media, MetaRow, Statement, Numeral, TextLink, Tile, NumberedSteps, PlainList,
        GroupedList, SpecTable, TimeTable, QuoteBlock, PortraitFrame,
        Prose, ArticleFigure, AuthorCard, ReviewedBy, TableOfContents, ShareBar, Pagination,
        Section, HeroFullBleed, HeroSplit, HeroStatement, SplitSection, BandStatement, PanoramaCaption,
        PeopleRow, NumeralsSplit, TileGrid, IndexList, ClosingCTA, FormSplit, ArticleHeader, RelatedArticles,
      } = NS;
      const P = "../assets/photos/";
      const doctors = [
        { name: "Dr. P.A. Kareem", role: "Founder, Chairman & Chief Naturopathy Consultant", detail: "Government of India-certified Naturopathy Practitioner" },
        { name: "Dr. Bahja Janu", role: "Medical Director", src: P + "doctor-bahja-janu-portrait-cropped.jpeg" },
      ];
      const programmes = [
        { name: "Stress Management", focus: "Mind", durations: "7–14 nights", photo: "balcony", alt: "A balcony over the valley", text: "Doctor-led routines, therapies and rest for guests managing sustained stress, poor sleep or fatigue.", slug: "stress-management" },
        { name: "Detox", focus: "Metabolic", durations: "7–21 nights", photo: "water-wall", alt: "The water wall court", text: "Your doctor may recommend a meal plan or supervised fasting based on your assessment. Therapies may also form part of your programme.", slug: "detox" },
        { name: "Weight Management", focus: "Metabolic", durations: "14–21 nights", photo: "grounds", alt: "The grounds", text: "Meals, daily activity and therapies, with weight and vitals reviewed by a doctor each morning.", slug: "weight-management" },
      ];
      const tiles = programmes.map((p) => <Tile key={p.slug} src={P + p.photo + ".jpg"} alt={p.alt} title={p.name} meta={[p.focus, p.durations]} text={p.text} href={"#/en/programs/" + p.slug} />);
      const careSteps = [
        { title: "Consultation and assessment", text: "Our doctors consider your medical history, current health, lifestyle and goals." },
        { title: "A plan for you", text: "They then plan your treatments, meals, activity and rest." },
        { title: "Therapies and daily routines", text: "Your doctor may recommend therapies based on your assessment and programme." },
        { title: "Progress reviewed", text: "The plan is reviewed during your stay and adjusted where necessary." },
      ];
      const day = [
        { time: "Morning", title: "Vitals and doctor review", text: "Vitals and a short doctor review, then yoga therapy in the hall. Movement and breathwork are adapted to what you can manage that day." },
        { time: "Midday", title: "Therapies", text: "Therapy sessions may include mud therapy, hydrotherapy, massage or acupuncture, sequenced by the clinical team." },
        { time: "Afternoon", title: "Sunlight, walking or reading", text: "Depending on your programme, the afternoon may include controlled sunlight, walking on the grounds, or time in the library." },
        { time: "Evening", title: "Meal and rest", text: "A meal planned for your programme, a mind-body session and an early night." },
      ];
      const rooms = [
        { name: "Standard Room", size: "260 sq.ft", occ: "Single or double" },
        { name: "Junior Suite", size: "420 sq.ft", occ: "Single or double" },
        { name: "Superior Room", size: "300 sq.ft · balcony", occ: "Single or double" },
        { name: "Premium Room", size: "460 sq.ft · balcony", occ: "Single or double" },
        { name: "Executive Suite", size: "530 sq.ft · balcony", occ: "Single or double" },
      ];
      const roomCols = [{ key: "name", label: "Room" }, { key: "size", label: "Size", accent: true, mobileLabel: true }, { key: "occ", label: "Occupancy", mobileLabel: true }];
      const contact = [
        { icon: "phone", label: "+91 9553 600 100", href: "tel:+919553600100" },
        { icon: "mail", label: "heal@shantara.life", href: "mailto:heal@shantara.life" },
        { icon: "map-pin", label: "Chennamangallur, Kozhikode, Keralam, India - 673602" },
      ];
      const contactPlain = contact.map(({ icon, ...c }) => c);
      const tocItems = [
        { id: "how-meals-are-planned", label: "How meals are planned" },
        { id: "supervised-fasting", label: "Supervised fasting" },
        { id: "dietary-requirements", label: "Dietary requirements" },
        { id: "at-a-glance", label: "At a glance" },
      ];
      const articleBody = <>
        <p>Meals at Shantara are part of your programme. They are planned after your consultation and assessment, and reviewed with the rest of your plan during your stay.</p>
        <h2 id="how-meals-are-planned">How meals are planned</h2>
        <p>Your doctor considers your medical history, current health and goals, then recommends a meal plan. The kitchen prepares meals to that plan. <a href="#">Read about the care model</a>.</p>
        <ul>
          <li>Meals are planned for your programme, not chosen from a menu.</li>
          <li>Your doctor may adjust the plan as your stay goes on.</li>
          <li>Tell the team about allergies or dietary requirements before you arrive.</li>
        </ul>
        <h2 id="supervised-fasting">Supervised fasting</h2>
        <p>Your doctor may recommend supervised fasting based on your assessment. It is never a default and is reviewed each day.</p>
        <h3>What a fasting day may include</h3>
        <ol>
          <li>Vitals and a short doctor review in the morning.</li>
          <li>Prescribed juices, soups or water through the day.</li>
          <li>Rest, with therapies as recommended.</li>
        </ol>
        <blockquote><p>The plan is reviewed during your stay and adjusted where necessary.</p><footer>The care model</footer></blockquote>
        <h2 id="dietary-requirements">Dietary requirements</h2>
        <p>Share any allergies, intolerances or religious requirements when you book a consultation. The team will confirm what can be accommodated.</p>
        <figure><img src={P + "dining-table-set-detail.jpg"} alt="A table set for a meal" /><figcaption>A table set in the dining room.</figcaption></figure>
        <h2 id="at-a-glance">At a glance</h2>
        <table>
          <thead><tr><th>Part of the day</th><th>What it may include</th></tr></thead>
          <tbody>
            <tr><td>Morning</td><td>A meal or juice planned for your programme</td></tr>
            <tr><td>Midday</td><td>The main meal of the day</td></tr>
            <tr><td>Evening</td><td>A light meal and an early night</td></tr>
          </tbody>
        </table>
      </>;

      switch (name) {
        case "Button":
          return <div className="stack" style={{ maxWidth: "none" }}>
            <div className="row">
              <Button size="lg">Book a Consultation</Button>
              <Button variant="secondary" size="lg">View programmes</Button>
              <Button variant="link" endIcon={<Icon name="arrow-right" size={16} />}>View conditions</Button>
            </div>
            <div className="row">
              <Button>Book a Consultation</Button>
              <Button variant="secondary">Speak to our team</Button>
              <Button disabled>Send your details</Button>
            </div>
            <div data-ground="himalaya" style={{ padding: 24 }}>
              <div className="row">
                <Button size="lg">Book a Consultation</Button>
                <Button variant="secondary" size="lg">View programmes</Button>
                <Button variant="link" endIcon={<Icon name="arrow-right" size={16} />}>View conditions</Button>
              </div>
            </div>
          </div>;
        case "IconButton":
          return <div className="row">
            <IconButton label="Favourite"><Icon name="heart" size={18} /></IconButton>
            <IconButton variant="solid" label="Add"><Icon name="plus" size={18} /></IconButton>
            <IconButton variant="outline" label="Share"><Icon name="share-2" size={18} /></IconButton>
          </div>;
        case "Icon":
          return <div style={{ display: "flex", flexDirection: "column", gap: 28, maxWidth: 960 }}>
            {Object.entries(NS.ICON_GROUPS || {}).map(([group, names]) => <div key={group}>
              <p style={{ margin: "0 0 10px", font: "var(--type-caption)", color: "var(--text-muted)" }}>{group}</p>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(112px, 1fr))", gap: 8 }}>
                {names.map((n) => <div key={n} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 10, padding: "16px 6px 12px", background: "var(--surface-card)", borderRadius: "var(--radius-xs)", color: "var(--text-primary)" }}>
                  <Icon name={n} size={24} />
                  <code style={{ font: "var(--weight-regular) 11px/1.3 var(--font-mono)", color: "var(--text-secondary)", textAlign: "center", overflowWrap: "anywhere" }}>{n}</code>
                </div>)}
              </div>
            </div>)}
          </div>;
        case "Logo":
          return <div className="row">
            <Logo mark="wordmark" tone="olive" height={20} />
            <Logo mark="icon" tone="olive" height={28} />
          </div>;
        case "Card":
          return <Card padding="sm" style={{ maxWidth: 280 }}>
            <h4 style={{ font: "var(--type-h4)", fontSize: "var(--text-lg)", margin: "0 0 4px" }}>Mud therapy</h4>
            <p style={{ margin: 0, color: "var(--text-secondary)", font: "var(--type-caption)" }}>Prescribed therapy · 90 min</p>
          </Card>;
        case "Badge":
          return <div className="stack" style={{ maxWidth: "none" }}>
            <div className="row">
              <Badge>7 nights</Badge>
              <Badge tone="brand">Prescribed</Badge>
              <Badge tone="accent">New</Badge>
              <Badge tone="success" dot>Confirmed</Badge>
              <Badge tone="info">In review</Badge>
              <Badge tone="warning">Awaiting reports</Badge>
              <Badge tone="danger">Cancelled</Badge>
              <Badge tone="outline">Waitlist</Badge>
            </div>
            <div className="row">
              <span style={{ font: "var(--type-body)" }}>Mud therapy</span><Badge tone="brand">Prescribed</Badge>
              <Button size="sm" variant="secondary">View schedule</Button>
            </div>
          </div>;
        case "Tag": {
          const [picked, setPicked] = React.useState(["Yoga therapy"]);
          const flip = (v) => setPicked((c) => c.includes(v) ? c.filter((x) => x !== v) : [...c, v]);
          return <div className="stack" style={{ maxWidth: "none" }}>
            <div className="row">
              {["Yoga therapy", "Hydrotherapy", "Mud therapy"].map((v) => <Tag key={v} selected={picked.includes(v)} onClick={() => flip(v)}>{v}</Tag>)}
            </div>
            <div className="row">
              <Tag>Type 2 diabetes</Tag>
              <Tag selected>In stay</Tag>
              <Tag onRemove={() => {}}>No dairy</Tag>
            </div>
          </div>;
        }
        case "Divider":
          return <div className="stack" style={{ width: 280 }}>
            <p style={{ margin: 0, fontSize: "var(--text-sm)" }}>Above</p>
            <Divider />
            <p style={{ margin: 0, fontSize: "var(--text-sm)" }}>Below</p>
          </div>;
        case "PatternPanel":
          return <PatternPanel tone="olive" edge="right" band="288px" data-ground="himalaya" style={{ width: "100%" }}>
            <div style={{ padding: "clamp(24px, 3vw, 48px)", display: "flex", flexDirection: "column", gap: 16 }}>
              <Logo mark="wordmark" tone="cream" height={16} />
              <p style={{ margin: 0, font: "var(--type-body-sm)", color: "var(--text-secondary)", maxWidth: "44ch" }}>Band 288px, cell 144px (band / 2). Under 880px of panel width the band drops and the padding returns to the content.</p>
            </div>
          </PatternPanel>;
        case "Input":
          return <div className="stack">
            <Input label="Full name" required placeholder="As on your passport" />
            <Input label="Phone or WhatsApp" type="tel" startIcon={<Icon name="phone" size={16} />} placeholder="+91 98765 43210" hint="Include your country code." />
            <Input label="Email" required defaultValue="anya.raman@" error="Enter an email address like name@example.com." />
            <Input label="City" disabled defaultValue="Kozhikode" />
          </div>;
        case "Textarea":
          return <div className="stack">
            <Textarea label="Health concerns" optional hint="Conditions, medication and anything your doctor should know." />
            <Textarea label="Reason for your visit" required rows={3} error="Tell us briefly why you would like to visit." />
          </div>;
        case "Select":
          return <div className="stack">
            <Select label="Country of residence" required placeholder="Choose a country" options={["India", "United Arab Emirates", "United Kingdom"]} />
            <Select label="Programme of interest" defaultValue="Detox" options={["Stress Management", "Detox", "Weight Management"]} hint="Your doctor confirms the programme after assessment." />
            <Select label="Room" disabled placeholder="Chosen at booking" options={[]} />
          </div>;
        case "Checkbox":
          return <div className="stack" style={{ gap: 0 }}>
            <Checkbox label="I have medical reports from the last 12 months" description="You can share them with our team after we call." defaultChecked />
            <Checkbox label="Unchecked" />
            <Checkbox label="Mixed" indeterminate />
            <Checkbox label="Disabled, checked" disabled defaultChecked />
            <Checkbox label="I agree to be contacted about my consultation" required error="Please tick this box so our team can contact you." />
          </div>;
        case "Radio":
          return <div className="stack" style={{ gap: 0 }}>
            <Radio name="stay" label="First visit" defaultChecked />
            <Radio name="stay" label="Returning guest" />
            <Radio name="stay2" label="Disabled" disabled />
            <div style={{ display: "grid", gap: 12, marginTop: 16 }}>
              <Radio card name="len" label="7 nights" description="A shorter first stay" defaultChecked />
              <Radio card name="len" label="14 nights" description="Often recommended" />
            </div>
          </div>;
        case "Switch":
          return <div className="stack" style={{ gap: 0 }}>
            <Switch label="Remind me the day before" defaultChecked />
            <Switch label="Off" />
            <Switch label="Disabled" disabled />
          </div>;
        case "Tabs":
          return <Tabs items={["Overview", "Therapies", "Rooms"]} />;
        case "Breadcrumbs":
          return <Breadcrumbs items={[{ label: "Programmes", href: "#" }, { label: "Wellness", href: "#" }, "Detox"]} />;
        case "Accordion":
          return <Accordion items={[{ title: "How long should I stay?", content: "Duration depends on the programme and your assessment." }]} />;
        case "LanguageSelector":
          return <div style={{ display: "flex", flexWrap: "wrap", gap: 48, minHeight: 440 }}>
            <div><p style={{ margin: "0 0 8px", font: "var(--type-caption)", color: "var(--text-muted)" }}>Closed</p><LanguageSelector locale="en" rest="" onSelect={() => {}} /></div>
            <div><p style={{ margin: "0 0 8px", font: "var(--type-caption)", color: "var(--text-muted)" }}>Open</p><div style={{ display: "flex", justifyContent: "flex-end", width: 260 }}><LanguageSelector locale="en" rest="" onSelect={() => {}} defaultOpen /></div></div>
          </div>;
        case "Dialog": {
          const [open, setOpen] = React.useState(true);
          return <div className="row">
            <Button onClick={() => setOpen(true)}>Open dialog</Button>
            <Dialog
              open={open}
              onClose={() => setOpen(false)}
              title="Send your details?"
              description="A member of our team will call you back to arrange your consultation."
              footer={<><Button variant="secondary" onClick={() => setOpen(false)}>Not yet</Button><Button onClick={() => setOpen(false)}>Yes, send</Button></>}
            />
          </div>;
        }
        case "Toast":
          return <div className="stack">
            <Toast title="Details sent" message="Our team will call you back." onClose={() => {}} />
            <Toast tone="success" title="Consultation booked" onClose={() => {}} />
          </div>;
        case "Tooltip":
          return <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-start", gap: 96 }}>
            <Tooltip content="Prescribed by your doctor" side="end" defaultOpen>
              <IconButton variant="outline" label="About this therapy"><Icon name="info" size={20} /></IconButton>
            </Tooltip>
            <Tooltip content="Quiet hours: 9pm–7am" side="bottom" defaultOpen>
              <Button variant="secondary">Quiet hours</Button>
            </Tooltip>
          </div>;
        case "Spinner":
          return <div className="stack">
            <div className="row" style={{ gap: 32 }}>
              <Spinner size="sm" />
              <Spinner />
              <Spinner size="lg" />
            </div>
            <Spinner size="lg" label="Checking availability" showLabel />
            <div className="row"><Button disabled startIcon={<Spinner size="sm" color="currentColor" label="Sending" />}>Sending</Button></div>
          </div>;
        /* ── Editorial ── */
        case "Media":
          return <div className="stack" style={{ maxWidth: 880 }}>
            <Media src={P + "balcony.jpg"} alt="A balcony over the valley" ratio="4:3" style={{ maxWidth: 420 }} />
            <Media src={P + "valley.jpg"} alt="The Chennamangallur valley from the hilltop" ratio="21:9" mobileRatio="4:3" />
          </div>;
        case "MetaRow":
          return <div className="stack" style={{ maxWidth: 720, gap: 24 }}>
            <MetaRow items={["Metabolic", "7–21 nights"]} />
            <MetaRow items={[{ icon: "tag", label: "Food & Recipes" }, { icon: "calendar-days", label: "12 August 2026", dateTime: "2026-08-12" }, { icon: "clock", label: "4 min read" }]} />
            <MetaRow size="sm" items={["Reviewed by Dr. Bahja Janu, Medical Director", "Updated August 2026"]} />
          </div>;
        case "Statement":
          return <div className="stack" style={{ maxWidth: 880, gap: 56 }}>
            <Statement sub="The clinical team plans your programme and adjusts it where necessary during your stay.">
              Your programme is planned after consultation and assessment.
            </Statement>
            <Statement as="h3" size="h3" meta={["Metabolic", "7–21 nights"]} sub="Your doctor may recommend a meal plan or supervised fasting based on your assessment.">Detox</Statement>
          </div>;
        case "Numeral":
          return <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0, 1fr))", gap: "var(--grid-gap)", maxWidth: 560 }}>
            <Numeral value="25,000+" label="guests since 2000" />
            <Numeral value="13" label="therapies" />
          </div>;
        case "TextLink":
          return <div className="stack" style={{ maxWidth: "none" }}>
            <div className="row" style={{ gap: 32 }}>
              <TextLink href="#">View conditions</TextLink>
              <TextLink href="#">Read about the programme</TextLink>
            </div>
            <div data-ground="pine" style={{ padding: 24 }}><TextLink href="#">All programmes</TextLink></div>
          </div>;
        case "Tile":
          return <div className="stack" style={{ maxWidth: 960, gap: 48 }}>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(240px, 1fr))", gap: "var(--grid-gap)" }}>
              {tiles[0]}
              <Tile src={P + "dining.jpg"} alt="The dining room" title="How meals are planned during a stay" meta={[{ icon: "tag", label: "Food & Recipes" }, { icon: "clock", label: "4 min read" }]} href="#/en/journal/how-meals-are-planned" />
            </div>
            <Tile layout="row" src={P + "courtyard.jpg"} alt="The courtyard" meta={["Immersive", "21–28 nights"]} title="Complete Healing" text="For guests managing several long-standing conditions at once, across metabolic, musculoskeletal and mental health." href="#/en/programs/complete-healing" />
          </div>;
        case "NumberedSteps":
          return <div className="stack" style={{ maxWidth: "none", gap: 64 }}>
            <NumberedSteps columns={4} items={careSteps} />
            <NumberedSteps columns={2} start={9} items={careSteps} />
            <NumberedSteps orientation="vertical" items={careSteps} />
          </div>;
        case "PlainList":
          return <PlainList columns={2} items={["En-suite bathroom with rain shower", "Individually controlled central air-conditioning", "Orthopaedic mattress", "Electronic safe, Wi-Fi, smart LED TV"]} style={{ maxWidth: 720 }} />;
        case "GroupedList":
          return <GroupedList columns={3} groups={[
            { label: "Mind", items: [{ label: "Stress Management", href: "#" }] },
            { label: "Metabolic", items: [{ label: "Detox", href: "#" }, { label: "Weight Management", href: "#" }] },
            { label: "Clinical", items: ["Diabetes Reversal", "Longevity", "Men's Vitality"] },
            { label: "Rest", items: ["Executive Wellness", "Weekend Rejuvenation"] },
            { label: "Immersive", items: ["Complete Healing"] },
            { label: "Groups", items: ["Corporate Retreats"] },
          ]} />;
        case "SpecTable":
          return <div style={{ maxWidth: 720 }}><SpecTable caption="Room categories" showHeader columns={roomCols} rows={rooms} /></div>;
        case "TimeTable":
          return <div style={{ maxWidth: 880 }}><TimeTable rows={day} /></div>;
        case "QuoteBlock":
          return <QuoteBlock style={{ maxWidth: 960 }}
            quote="Naturopathy treats the causes of a condition through diet, activity, therapies and rest rather than through medication."
            cite="Shantara Naturopathy Retreat" role="Our approach to care"
            facts={[
              { label: "Since 2000", text: "The evolution of Hygiene Nature Cure Hospital, which has cared for guests since 2000." },
              { label: "The setting", text: "A hilltop above the Chennamangallur valley, in Kozhikode, Kerala." },
            ]} />;
        case "PortraitFrame":
          return <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0, 240px))", gap: "var(--grid-gap)" }}>
            {doctors.map((d) => <PortraitFrame key={d.name} {...d} />)}
          </div>;
        case "Prose":
          return <Prose>{articleBody}</Prose>;
        case "ArticleFigure":
          return <div style={{ maxWidth: 880 }}>
            <ArticleFigure src={P + "dining-restaurant-valley-window.jpg"} alt="The dining room by the valley window" caption="Meals are served in the dining room, planned for each guest's programme." credit="Photograph: Shantara" style={{ marginTop: 0 }} />
          </div>;
        case "AuthorCard":
          return <div className="stack" style={{ maxWidth: 720, gap: 32 }}>
            <AuthorCard name="Dr. Bahja Janu" role="Medical Director" src={P + "doctor-bahja-janu-portrait-cropped.jpeg"} href="#" action={<TextLink href="#">About our doctors</TextLink>} />
            <AuthorCard name="Dr. P.A. Kareem" role="Founder, Chairman & Chief Naturopathy Consultant" href="#" />
          </div>;
        case "ReviewedBy":
          return <div className="stack" style={{ maxWidth: 720, gap: 32 }}>
            <ReviewedBy name="Dr. Bahja Janu" role="Medical Director" href="#" date="12 August 2026" dateTime="2026-08-12" />
            <ReviewedBy boxed name="Dr. Bahja Janu" role="Medical Director" href="#" date="12 August 2026" dateTime="2026-08-12" nextReview="August 2027" note="General information, not a diagnosis. Speak to a doctor about your own health." />
          </div>;
        case "TableOfContents":
          return <div style={{ display: "grid", gap: "var(--grid-gap)", gridTemplateColumns: "minmax(0,1fr)", maxWidth: 1100 }} className="spec-article">
            <style>{"@media (min-width:1000px){.spec-article{grid-template-columns:minmax(0,8fr) minmax(0,3fr)!important;column-gap:calc(var(--grid-gap)*2)!important}.spec-article>nav{order:2}}"}</style>
            <TableOfContents items={tocItems} />
            <Prose>{articleBody}</Prose>
          </div>;
        case "ShareBar":
          return <div className="stack" style={{ maxWidth: 720, gap: 24 }}>
            <ShareBar url="https://shantara.life/en/journal/how-meals-are-planned" title="How meals are planned during a stay" />
            <ShareBar compact url="https://shantara.life/en/journal/how-meals-are-planned" title="How meals are planned during a stay" />
          </div>;
        case "Pagination": {
          const [pg, setPg] = React.useState(3);
          return <div style={{ maxWidth: 960 }}><Pagination page={pg} pageCount={8} onChange={setPg} /></div>;
        }

        /* ── Sections (full width: the body padding is removed below) ── */
        case "Section":
          return <>
            {[["merino", "Merino — the page"], ["stone", "Stone — a quiet change of room"], ["himalaya", "Himalaya — dark, ink re-pointed"], ["pine", "Pine — dark, ink re-pointed"]].map(([g, label]) => (
              <Section key={g} ground={g} space="sm">
                <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>
                  <p style={{ margin: 0, font: "var(--type-caption)", color: "var(--text-muted)" }}>{label}</p>
                  <Statement size="title">Your programme is planned after consultation and assessment.</Statement>
                  <div className="sh-actions"><Button>Book a Consultation</Button><TextLink href="#">Read what to expect</TextLink></div>
                </div>
              </Section>
            ))}
          </>;
        case "HeroFullBleed":
          return <HeroFullBleed
            src={P + "arrival-dusk.jpg"} alt="Shantara at dusk"
            title="A doctor-led naturopathy retreat in Kerala"
            sub="Drug-free naturopathy on a hilltop above the Chennamangallur valley. Every stay begins with a consultation, and your programme is planned by our doctors."
            actions={<><Button size="lg">Book a Consultation</Button><TextLink href="#">View programmes</TextLink></>}
            meta={["Kozhikode, Kerala", "Since 2000"]} />;
        case "HeroSplit":
          return <>
            <HeroSplit
              src={P + "water-wall.jpg"} alt="The water wall court"
              breadcrumbs={<Breadcrumbs items={[{ label: "Programmes", href: "#" }, "Detox"]} />}
              title="Detox"
              meta={[{ icon: "leaf", label: "Metabolic" }, { icon: "moon", label: "7–21 nights" }]}
              sub="Your doctor may recommend a meal plan or supervised fasting based on your assessment. Therapies may also form part of your programme."
              actions={<><Button size="lg">Book a Consultation</Button><TextLink href="#">What the programme includes</TextLink></>}
              facts={<PlainList columns={2} size="sm" items={["Consultation and assessment first", "Doctor review each morning", "Meals planned for you", "Therapies prescribed by your doctor"]} />} />
            <HeroSplit ground="stone" mediaSide="start" split="60"
              src={P + "room-premium.jpg"} alt="A room with a balcony"
              title="Stays and rooms"
              meta={["Five room categories", "Single or double occupancy"]}
              sub="Each stay is residential. Your room is chosen when your programme is confirmed."
              actions={<Button size="lg">Book a Consultation</Button>} />
          </>;
        case "HeroStatement":
          return <>
            <HeroStatement
              breadcrumbs={<Breadcrumbs items={[{ label: "Home", href: "#" }, "Conditions"]} />}
              title="Conditions we commonly see"
              sub="Our doctors see guests with a range of long-standing conditions. Programmes are planned after consultation and assessment."
              actions={<Button size="lg">Book a Consultation</Button>}
              pattern
              meta={["Reviewed by Dr. Bahja Janu, Medical Director", "Updated August 2026"]} />
            <HeroStatement ground="stone" tall={false}
              breadcrumbs={<Breadcrumbs items={[{ label: "Home", href: "#" }, "About"]} />}
              title="A doctor-led naturopathy retreat in Kerala, since 2000"
              sub="Shantara Naturopathy Retreat is the evolution of Hygiene Nature Cure Hospital, on a hilltop above the Chennamangallur valley."
              src={P + "courtyard.jpg"} alt="The courtyard" ratio="4:3"
              meta={["Kozhikode, Keralam", "25,000+ guests since 2000"]} />
          </>;
        case "SplitSection":
          return <>
            <SplitSection src={P + "balcony.jpg"} alt="A balcony over the valley">
              <Statement meta={["Mind", "7–14 nights"]} sub="Doctor-led routines, therapies and rest for guests managing sustained stress, poor sleep or fatigue.">Stress Management</Statement>
              <div><TextLink href="#">Read about the programme</TextLink></div>
            </SplitSection>
            <SplitSection src={P + "room-premium.jpg"} alt="A room with a balcony" mediaSide="end" split="40" ground="stone">
              <Statement sub="Five room categories, designed for comfortable residential stays.">Five room categories</Statement>
              <SpecTable caption="Room categories" columns={roomCols} rows={rooms} />
            </SplitSection>
          </>;
        case "BandStatement":
          return <BandStatement>
            <Statement sub="The clinical team plans your programme and adjusts it where necessary during your stay.">
              Your programme is planned after consultation and assessment.
            </Statement>
            <PlainList columns={2} items={careSteps.map((s) => s.title)} />
          </BandStatement>;
        case "PanoramaCaption":
          return <PanoramaCaption src={P + "valley.jpg"} alt="The Chennamangallur valley from the hilltop" title="Overlooking the Chennamangallur valley" />;
        case "PeopleRow":
          return <Section>
            <PeopleRow title="Your programme is planned by our doctors." people={doctors} action={<TextLink href="#">About Shantara</TextLink>} />
          </Section>;
        case "NumeralsSplit":
          return <Section ground="stone">
            <NumeralsSplit title="Doctor-led naturopathy, planned around your assessment."
              numerals={[{ value: "25,000+", label: "guests since 2000" }, { value: "13", label: "therapies" }]} />
          </Section>;
        case "TileGrid":
          return <Section>
            <TileGrid title="Naturopathy programmes" action={<TextLink href="#">All programmes</TextLink>}>{tiles}</TileGrid>
          </Section>;
        case "IndexList":
          return <Section>
            <IndexList groups={[
              { label: "Metabolic", items: [
                { title: "Diabetes", text: "Residential programmes planned around blood-sugar control, meals and daily doctor review.", href: "#" },
                { title: "Weight management", text: "Meals, activity and therapies, with weight and vitals reviewed each morning.", href: "#" },
              ] },
              { label: "Hormonal", items: [
                { title: "PCOS", text: "A programme may be planned around hormonal health, meals, activity and rest, following assessment.", href: "#" },
              ] },
              { label: "Musculoskeletal", items: [
                { title: "Arthritis", text: "Therapies, movement and rest may be recommended to support joint comfort, following assessment.", href: "#" },
              ] },
            ]} />
          </Section>;
        case "ClosingCTA":
          return <>
            <ClosingCTA
              src={P + "exterior-entrance-dusk-lit-canopy.jpg"} alt="The entrance at dusk"
              title="A stay is confirmed after a doctor has spoken with you."
              sub="Share your name and a number we can reach. Our team will contact you to arrange a consultation."
              action={<Button size="lg">Book a Consultation</Button>}
              secondaryAction={<TextLink href="#">View programmes</TextLink>}
              contact={contact} />
            <ClosingCTA variant="ground" ground="himalaya"
              title="A stay is confirmed after a doctor has spoken with you."
              action={<Button size="lg">Book a Consultation</Button>}
              contact={contactPlain} />
            <ClosingCTA variant="compact" ground="stone"
              title="Questions about a programme?"
              sub="Our team will call you back to arrange a consultation."
              action={<Button>Book a Consultation</Button>}
              secondaryAction={<Button variant="secondary">Call +91 9553 600 100</Button>} />
          </>;
        case "FormSplit":
          return <Section>
            <FormSplit aside={<>
              <PortraitFrame src={P + "doctor-bahja-janu-portrait-cropped.jpeg"} name="Dr. Bahja Janu" role="Medical Director" style={{ maxWidth: 220 }} />
              <Statement as="h3" size="title" sub="A member of the team will call you to understand what you need. A doctor then reviews whether a stay is the right next step.">We'll be in touch</Statement>
            </>}>
              <Statement as="h2" size="title" sub="Share your name and a number we can reach. Our team will contact you to arrange a consultation.">Send your details</Statement>
              <Input label="Name" />
              <Input label="Mobile / WhatsApp number" placeholder="+91" />
              <Input label="Email" type="email" />
              <Select label="Country" options={["India", "United Arab Emirates", "United Kingdom", "Other"]} />
              <Textarea label="Anything you'd like us to know?" rows={3} />
              <p style={{ margin: 0, font: "var(--type-caption)", color: "var(--text-muted)" }}>We will use these details only to contact you.</p>
              <div><Button size="lg">Send your details</Button></div>
            </FormSplit>
          </Section>;
        case "ArticleHeader":
          return <ArticleHeader
            breadcrumbs={<Breadcrumbs items={[{ label: "Journal", href: "#" }, "Food & Recipes"]} />}
            title="How meals are planned during a stay"
            dek="How meals are planned around your programme and dietary requirements."
            category={{ label: "Food & Recipes", href: "#" }}
            date="12 August 2026" dateTime="2026-08-12" readTime="4 min read"
            author={{ name: "Dr. Bahja Janu", role: "Medical Director", src: P + "doctor-bahja-janu-portrait-cropped.jpeg", href: "#" }}
            reviewer={{ name: "Dr. P.A. Kareem", role: "Chief Naturopathy Consultant", href: "#" }}
            updated="20 August 2026" updatedDateTime="2026-08-20"
            share={<ShareBar compact label="" url="https://shantara.life/en/journal/how-meals-are-planned" title="How meals are planned during a stay" />}
            src={P + "dining-restaurant-valley-window.jpg"} alt="The dining room by the valley window"
            caption="Meals are served in the dining room by the valley window." />;
        case "RelatedArticles":
          return <Section ground="stone">
            <RelatedArticles action={<TextLink href="#">All articles</TextLink>} articles={[
              { title: "How programme duration is decided", href: "#", src: P + "treatment.jpg", alt: "A treatment room", category: "Clinical Guides", readTime: "5 min read" },
              { title: "Managing PCOS through lifestyle", href: "#", src: P + "grounds.jpg", alt: "The grounds", category: "Clinical Guides", readTime: "6 min read" },
              { title: "How rooms are designed", href: "#", src: P + "room-twin.jpg", alt: "A twin room", category: "Life at Shantara", readTime: "3 min read" },
            ]} />
          </Section>;
        default:
          return <p className="err">No specimen for {name}</p>;
      }
    }

    const SECTIONS = ["Section", "HeroFullBleed", "HeroStatement", "SplitSection", "BandStatement", "PanoramaCaption", "PeopleRow", "NumeralsSplit", "TileGrid", "IndexList", "ClosingCTA", "FormSplit", "HeroSplit", "ArticleHeader", "RelatedArticles"];
    if (SECTIONS.includes(name)) document.body.style.padding = "0";
    ReactDOM.createRoot(document.getElementById("root")).render(<Specimen />);
  </script>
</body>
</html>
