<!-- @dsCard group="Brand" viewport="700x200" name="Scrims & glass" subtitle="How type survives over imagery" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-page);font-family:var(--font-body)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div style="position:relative;height:158px;border-radius:var(--radius-md);overflow:hidden;background:var(--color-himalaya) url(../assets/photos/lobby-valley.jpg) center/cover">
<span style="position:absolute;inset:0;background:var(--scrim-bottom)"></span>
<span style="position:absolute;left:14px;bottom:14px;color:var(--color-merino);font:var(--weight-light) var(--text-xl)/1.1 var(--font-display)">Bottom scrim</span>
<span style="position:absolute;left:14px;top:14px;font-family:var(--font-mono);font-size:10px;color:color-mix(in srgb,var(--color-merino) 70%,transparent)">--scrim-bottom</span>
</div>
<div style="position:relative;height:158px;border-radius:var(--radius-md);overflow:hidden;background:var(--color-pine-tree) url(../assets/photos/water-wall.jpg) center/cover;display:grid;place-items:center">
<span style="background:var(--glass-fill);backdrop-filter:var(--blur-glass);-webkit-backdrop-filter:var(--blur-glass);padding:12px 20px;border-radius:999px;font-size:var(--text-sm);color:var(--color-pine-tree)">Glass capsule</span>
<span style="position:absolute;left:14px;top:14px;font-family:var(--font-mono);font-size:10px;color:color-mix(in srgb,var(--color-merino) 70%,transparent)">--glass-fill + --blur-glass</span>
</div>
</div></body></html>
